name: Development Task
description: Implement or improve project functionality.
labels:
- 'type: feature'
body:
- type: textarea
  id: field-1
  attributes:
    label: Objective
    description: What should be implemented and why?
  validations:
    required: true
- type: textarea
  id: field-2
  attributes:
    label: Technical approach
    description: Describe the proposed implementation and affected components.
  validations:
    required: true
- type: textarea
  id: field-3
  attributes:
    label: Acceptance criteria
    description: List measurable completion criteria, preferably as Markdown checkboxes.
  validations:
    required: true
- type: textarea
  id: field-4
  attributes:
    label: Dependencies and testing
    description: Identify dependencies and how the implementation will be tested.
  validations:
    required: false
