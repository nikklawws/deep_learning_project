name: Bug Report
description: Report incorrect behaviour or unexpected results.
labels:
- 'type: bug'
body:
- type: textarea
  id: field-1
  attributes:
    label: Problem
    description: Describe the observed behaviour.
  validations:
    required: true
- type: textarea
  id: field-2
  attributes:
    label: Steps to reproduce
    description: Include commands, inputs, configuration and relevant environment
      details.
  validations:
    required: true
- type: textarea
  id: field-3
  attributes:
    label: Expected behaviour
    description: Describe what should happen instead.
  validations:
    required: true
- type: textarea
  id: field-4
  attributes:
    label: Acceptance criteria
    description: Describe how the fix will be verified, including regression testing
      where applicable.
  validations:
    required: true
- type: textarea
  id: field-5
  attributes:
    label: Logs or additional context
    description: Include relevant errors without credentials or sensitive data.
  validations:
    required: false
