name: Research and Documentation
description: Investigate a topic or produce project documentation.
labels:
- 'type: research'
body:
- type: textarea
  id: field-1
  attributes:
    label: Objective
    description: State the question or documentation need.
  validations:
    required: true
- type: textarea
  id: field-2
  attributes:
    label: Scope and sources
    description: Describe the intended scope, relevant sources or existing material.
  validations:
    required: true
- type: textarea
  id: field-3
  attributes:
    label: Expected deliverable
    description: Specify the output and where it should be recorded.
  validations:
    required: true
- type: textarea
  id: field-4
  attributes:
    label: Acceptance criteria
    description: Define how completeness and quality will be assessed.
  validations:
    required: true
